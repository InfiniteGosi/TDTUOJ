spring:
  application:
    name: TDTUOJ
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8090

secretJwtString: ${SECRET_JWT_STRING}

aws:
  s3:
    region: ${AWS_S3_REGION}
    bucket: ${AWS_S3_BUCKET}
  accessKeyId: ${AWS_S3_ACCESS_KEY}
  secretKey: ${AWS_S3_SECRET_KEY}

judge0:
  api:
    url: ${JUDGE0_API_URL:http://localhost:2358}

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY}

openai:
  api:
    key: ${OPENAI_API_KEY}

gemini:
  api:
    key: ${GEMINI_API_KEY}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    tags:
      application: tdtuoj
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

ratelimit:
  enabled: true
  admin-bypass: false
  hash-ip: false
  tiers:
    default:
      capacity: 60
      window-seconds: 60
      authenticated-capacity: 120
    read-heavy:
      capacity: 120
      window-seconds: 60
      authenticated-capacity: 240
      paths:
        - method: GET
          pattern: "/api/problems/**"
        - method: GET
          pattern: "/api/contests/**"
        - method: GET
          pattern: "/api/users/**"
        - method: GET
          pattern: "/api/organizations/**"
    auth:
      capacity: 5
      window-seconds: 60
      authenticated-capacity: 10
      paths:
        - method: POST
          pattern: "/api/auth/login"
        - method: POST
          pattern: "/api/auth/register"
        - method: POST
          pattern: "/api/auth/google"
    submission:
      capacity: 3
      window-seconds: 60
      authenticated-capacity: 10
      paths:
        - method: POST
          pattern: "/api/submissions/**"
    visualizer:
      capacity: 5
      window-seconds: 60
      authenticated-capacity: 20
      paths:
        - method: POST
          pattern: "/api/visualize"
    ai:
      capacity: 0
      window-seconds: 60
      authenticated-capacity: 10
      paths:
        - method: POST
          pattern: "/api/hints"
        - method: POST
          pattern: "/api/problem-ai/**"
    admin:
      capacity: 0
      window-seconds: 60
      authenticated-capacity: 300
      paths:
        - method: "*"
          pattern: "/api/admin/**"